<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="jupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBA43A"/>
      <stop offset="50%" stop-color="#E84142"/>
      <stop offset="100%" stop-color="#9945FF"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#grid)"/>

  <circle cx="200" cy="190" r="140" fill="#FBA43A" opacity="0.12" filter="blur(50px)"/>
  <circle cx="1000" cy="190" r="140" fill="#9945FF" opacity="0.1" filter="blur(50px)"/>

  <!-- Logo Icon -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="130" height="130" rx="28" fill="#131b2e" stroke="url(#jupGrad)" stroke-width="3"/>
    <circle cx="65" cy="65" r="36" fill="none" stroke="url(#jupGrad)" stroke-width="4"/>
    <polygon points="65,38 85,78 45,78" fill="#FBA43A"/>
    <polygon points="65,92 45,52 85,52" fill="#9945FF" opacity="0.8"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="265" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Solana Jupiter Swap Aggregator
  </text>
  <text x="265" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#94a3b8">
    High-Throughput Liquidity Router &amp; Multi-Hop AMM Arbitrage Engine
  </text>

  <!-- Badges -->
  <g transform="translate(265, 235)">
    <rect x="0" y="0" width="120" height="30" rx="15" fill="#1e293b" stroke="#9945FF" stroke-width="1.2"/>
    <text x="60" y="20" font-family="monospace" font-size="12" font-weight="600" fill="#9945FF" text-anchor="middle">Solana Web3</text>

    <rect x="135" y="0" width="130" height="30" rx="15" fill="#1e293b" stroke="#FBA43A" stroke-width="1.2"/>
    <text x="200" y="20" font-family="monospace" font-size="12" font-weight="600" fill="#FBA43A" text-anchor="middle">Jupiter v6 API</text>

    <rect x="280" y="0" width="130" height="30" rx="15" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
    <text x="345" y="20" font-family="monospace" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">Orca / Raydium</text>

    <rect x="425" y="0" width="115" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="482" y="20" font-family="monospace" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">Apache-2.0</text>
  </g>
</svg>
